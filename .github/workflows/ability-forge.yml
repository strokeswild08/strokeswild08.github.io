name: Ability Forge portable source checks
on:
  push:
    paths: ['unreal-ability-forge/**', '.github/workflows/ability-forge.yml']
  pull_request:
    paths: ['unreal-ability-forge/**', '.github/workflows/ability-forge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable policies (not Unreal)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic unreal-ability-forge/tests/rules_test.cpp -o /tmp/forge-rules-test
          /tmp/forge-rules-test
      - name: Check source manifest and Python syntax (not editor execution)
        run: python3 unreal-ability-forge/tests/project_check.py
