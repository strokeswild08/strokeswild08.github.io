name: Thread and Ink story tests
on:
  push:
    paths: ['story-thread/**', '.github/workflows/story-thread-tests.yml']
  pull_request:
    paths: ['story-thread/**', '.github/workflows/story-thread-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
        working-directory: story-thread
