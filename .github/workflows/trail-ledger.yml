name: Trail Ledger Java checks
on:
  push:
    paths: ['java-quest-manager/**', '.github/workflows/trail-ledger.yml']
  pull_request:
    paths: ['java-quest-manager/**', '.github/workflows/trail-ledger.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash java-quest-manager/test.sh
