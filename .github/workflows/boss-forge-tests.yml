name: Nocturne encounter tests
on:
  push:
    paths: ['boss-forge/**', '.github/workflows/boss-forge-tests.yml']
  pull_request:
    paths: ['boss-forge/**', '.github/workflows/boss-forge-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
        working-directory: boss-forge
