name: Sprite Atlas Packer tests
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: sprite-atlas-packer
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/packing.test.cjs
      - run: node tests/ui.test.cjs
