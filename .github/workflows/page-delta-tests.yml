name: Page Delta tests
on:
  push:
    paths: ['page-delta/**', '.github/workflows/page-delta-tests.yml']
  pull_request:
    paths: ['page-delta/**', '.github/workflows/page-delta-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: page-delta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: page-delta/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
