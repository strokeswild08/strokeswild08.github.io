name: Breachline verification
on:
  push:
    paths:
      - 'breachline/**'
      - '.github/workflows/breachline.yml'
  pull_request:
    paths:
      - 'breachline/**'
      - '.github/workflows/breachline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: breachline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native C++ sanitizers and browser parity
        run: ./tests/run.sh
      - name: Install browser test tooling outside source
        run: |
          npm install --prefix "$RUNNER_TEMP/breachline-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/breachline-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Desktop and touch browser checks
        env:
          NODE_PATH: ${{ runner.temp }}/breachline-browser/node_modules
          PREVIEW_TO_LOG: '1'
        run: node tests/browser.cjs
      - name: Preserve browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breachline-browser-captures
          path: breachline/test-results/
          if-no-files-found: ignore
          retention-days: 30
